name: Bug report
description: Report a reproducible Cubed Core problem without sharing private artifacts.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Cubed Core.

        **Do not attach solve videos, frames, labels, BLE logs, calibration receipts, model files, credentials, private URLs, or full environment dumps.** Reproduce with a synthetic or expressly cleared fixture and sanitize logs according to `docs/PRIVACY.md`.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content check
      options:
        - label: I have not included private captures, personal data, credentials, private links, or unreviewed artifacts.
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Setup or CLI
        - Demo
        - Add video
        - Label
        - Decode
        - Runs
        - Cloud or GPU setup
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the smallest observable failure.
      placeholder: The command or action failed when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic/public inputs and include exact commands or UI actions.
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Include Cubed Core commit, OS, Python/Node versions, and relevant runtime/provider versions only.
      placeholder: |
        Cubed Core commit:
        OS:
        Python:
        Node:
        Relevant provider/runtime:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Minimal sanitized output
      description: Paste only the relevant redacted excerpt. Do not attach a full log or receipt.
      render: shell
