name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: >-
          uv sync --locked
          --python "${{ matrix.python-version }}"
          --extra dev
          --extra label
          --extra decode
      - run: uv pip check --python .venv/bin/python
      - run: uv run --no-sync python -m ruff format --check src tests scripts
      - run: uv run --no-sync python -m ruff check src tests scripts
      - run: uv run --no-sync python -m pytest -q

  windows-cpu-workbench:
    name: Native Windows CPU workbench
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: apps/lab-web/package-lock.json
      - run: >-
          uv sync --locked
          --python "3.12"
          --extra dev
          --extra label
          --extra decode
      - run: uv pip check --python .venv/Scripts/python.exe
      - run: uv run --no-sync cubed-core --help
      - run: >-
          uv run --no-sync python -m pytest -q
          tests/test_app.py
          tests/test_decode_jobs.py::test_native_decode_is_unavailable_on_windows
          tests/test_public_dataset_registration.py
          tests/test_workspace.py::test_workspace_path_fallback_supports_capture_lifecycle
          scripts/tests/test_download_dataset.py
          scripts/tests/test_download_release_assets.py
      - run: npm --prefix apps/lab-web ci
      - run: npm --prefix apps/lab-web test
      - run: npm --prefix apps/lab-web run build
      - name: Install the pinned browser for Playwright
        run: npm --prefix apps/lab-web exec -- playwright install chromium
      - name: Run Windows browser and accessibility checks
        run: npm --prefix apps/lab-web run test:e2e
      - name: Smoke the native CPU workbench
        shell: pwsh
        env:
          CUBED_CORE_ADMIN_TOKEN: cubed-core-ci-token-0123456789abcdef
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = Join-Path $env:RUNNER_TEMP "cubed-core-workspace"
          $stdout = Join-Path $env:RUNNER_TEMP "cubed-core-serve.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "cubed-core-serve.stderr.log"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $env:CUBED_CORE_WORKSPACE = $workspace
          $server = $null
          $failed = $false
          try {
            $python = (Resolve-Path ".venv/Scripts/python.exe").Path
            $server = Start-Process -FilePath $python `
              -ArgumentList @("-m", "cubed_core", "serve", "--host", "127.0.0.1", "--port", "8000") `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $baseUrl = "http://127.0.0.1:8000"
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              if ($server.HasExited) {
                throw "cubed-core serve exited before becoming ready"
              }
              try {
                $response = Invoke-WebRequest -Uri "$baseUrl/api/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The server may still be starting.
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "cubed-core serve did not become ready"
            }

            $headers = @{"X-Cubed-Admin-Token" = $env:CUBED_CORE_ADMIN_TOKEN}
            $checks = @(
              @{Path = "/"; Headers = @{}},
              @{Path = "/api/health"; Headers = @{}},
              @{Path = "/api/captures"; Headers = $headers},
              @{Path = "/demo/gtd1/decode-receipt.json"; Headers = @{}},
              @{Path = "/demo/gtd1/decode-result.json"; Headers = @{}},
              @{Path = "/demo/gtd1/overlay-track.json"; Headers = @{}}
            )
            foreach ($check in $checks) {
              $response = Invoke-WebRequest `
                -Uri "$baseUrl$($check.Path)" -Headers $check.Headers -TimeoutSec 10
              if ($response.StatusCode -ne 200) {
                throw "$($check.Path) returned HTTP $($response.StatusCode)"
              }
            }
          } catch {
            $failed = $true
            Write-Host "Windows workbench smoke failed: $($_.Exception.Message)"
            throw
          } finally {
            if ($null -ne $server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
              Wait-Process -Id $server.Id -ErrorAction SilentlyContinue
            }
            if ($failed) {
              Write-Host "cubed-core serve stdout:"
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host "cubed-core serve stderr:"
              if (Test-Path $stderr) { Get-Content $stderr }
            }
          }

  optional-python-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: decode-only
            sync_args: --extra dev --extra decode
            import-check: import numpy; import cubed_core.cube
          - name: label-cpu
            sync_args: --extra dev --extra tracker-cpu
            import-check: import cv2; import numpy; import onnxruntime; import cubed_core.vision
    name: Optional runtime (${{ matrix.runtime.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - run: >-
          uv sync --locked
          --python "3.12"
          ${{ matrix.runtime.sync_args }}
      - run: uv pip check --python .venv/bin/python
      - run: uv run --no-sync python -c "${{ matrix.runtime.import-check }}"
      - if: matrix.runtime.name == 'decode-only'
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_cube_notation.py
          tests/test_cube_state.py
          tests/test_research_decode_runner.py
      - if: matrix.runtime.name == 'label-cpu'
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_vision_geometry.py
          tests/test_vision_onnx.py
          tests/test_vision_sampling.py
          tests/test_vision_tracker.py
          tests/test_camera_tracker_backend.py
          tests/test_tracker_runtime.py

  dependency-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: apps/lab-web/package-lock.json
      - name: Verify universal lock and ephemeral CycloneDX exports
        run: make lock-check sbom-check
      - name: Build and verify ephemeral release evidence
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/cubed-core-release-evidence
        run: |
          make release-evidence \
            SOURCE_REF="$(git rev-parse HEAD)" \
            OUTPUT="$RELEASE_EVIDENCE_DIR"
          make release-evidence-verify OUTPUT="$RELEASE_EVIDENCE_DIR"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: apps/lab-web/package-lock.json
      - run: npm --prefix apps/lab-web ci
      - run: npm --prefix apps/lab-web test
      - run: npm --prefix apps/lab-web run build
      - name: Install the pinned browser for Playwright
        run: npm --prefix apps/lab-web exec -- playwright install --with-deps chromium
      - name: Run browser and accessibility checks
        run: npm --prefix apps/lab-web run test:e2e

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose config --quiet
      - run: docker build --tag cubed-core-ci .
      - name: Smoke the built workbench image
        shell: bash
        run: |
          docker run --detach --name cubed-core-ci \
            --publish 127.0.0.1:8000:8000 \
            --env CUBED_CORE_ADMIN_TOKEN=cubed-core-ci-token-0123456789abcdef \
            cubed-core-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs cubed-core-ci
              exit 1
            fi
            sleep 1
          done
          python3 scripts/cloud_smoke.py \
            --base-url http://127.0.0.1:8000 \
            --admin-token cubed-core-ci-token-0123456789abcdef
          demo_result_file="$RUNNER_TEMP/gtd1-decode-result.json"
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/demo/gtd1/decode-result.json \
            --output "$demo_result_file"
          printf '%s  %s\n' \
            9cbb4b17860dd88af61eb1da68f86c9c60c0f37054c5eeca505126fbfac8702b \
            "$demo_result_file" |
            sha256sum --check
      - if: always()
        run: docker rm --force cubed-core-ci 2>/dev/null || true
