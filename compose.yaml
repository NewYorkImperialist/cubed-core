x-build-args: &build-args
  UV_IMAGE: ${CUBED_CORE_UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.16@sha256:440fd6477af86a2f1b38080c539f1672cd22acb1b1a47e321dba5158ab08864d}
  NODE_IMAGE: ${CUBED_CORE_NODE_IMAGE:-node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3}
  PYTHON_IMAGE: ${CUBED_CORE_PYTHON_IMAGE:-python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c}

x-common-environment: &common-environment
  CUBED_CORE_ADMIN_TOKEN: ${CUBED_CORE_ADMIN_TOKEN:-}
  CUBED_CORE_DECODE_COMMAND: ${CUBED_CORE_DECODE_COMMAND:-}
  CUBED_CORE_DECODE_MODE: ${CUBED_CORE_DECODE_MODE:-disabled}
  CUBED_CORE_DECODE_RUNNER_LABEL: ${CUBED_CORE_DECODE_RUNNER_LABEL:-}
  CUBED_CORE_MAX_UPLOAD_BYTES: ${CUBED_CORE_MAX_UPLOAD_BYTES:-1073741824}
  CUBED_CORE_LABEL_PREDICT_COMMAND: ${CUBED_CORE_LABEL_PREDICT_COMMAND:-}
  CUBED_CORE_LABEL_MODEL_PATH: ${CUBED_CORE_LABEL_MODEL_PATH:-}
  CUBED_CORE_WORKSPACE: /workspace

x-lab: &lab
  build:
    context: .
    args:
      <<: *build-args
      CUBED_CORE_PYTHON_EXTRAS: label,decode
  image: ${CUBED_CORE_IMAGE:-cubed-core:local}
  command:
    - cubed-core
    - serve
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --browser-port
    - "${CUBED_CORE_PORT:-8000}"
    - --allow-network
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    <<: *common-environment
    CUBED_CORE_TRACKER_MODEL_MANIFEST: ${CUBED_CORE_TRACKER_MODEL_MANIFEST:-}
    CUBED_CORE_TRACKER_ONNX_PROVIDERS: ${CUBED_CORE_TRACKER_ONNX_PROVIDERS:-}
  volumes:
    - type: bind
      source: ${CUBED_CORE_WORKSPACE:-./workspace}
      target: /workspace
  user: "${CUBED_CORE_UID:-1000}:${CUBED_CORE_GID:-1000}"

services:
  lab:
    <<: *lab
    ports:
      - "${CUBED_CORE_BIND_ADDRESS:-127.0.0.1}:${CUBED_CORE_PORT:-8000}:8000"

  lab-label-cpu:
    <<: *lab
    profiles: [label-cpu]
    build:
      context: .
      args:
        <<: *build-args
        CUBED_CORE_PYTHON_EXTRAS: label,decode,tracker-cpu
    image: ${CUBED_CORE_LABEL_CPU_IMAGE:-cubed-core:label-cpu}
    environment:
      <<: *common-environment
      CUBED_CORE_TRACKER_MODEL_MANIFEST: /models/manifest.json
      CUBED_CORE_TRACKER_ONNX_PROVIDERS: CPUExecutionProvider
    volumes:
      - type: bind
        source: ${CUBED_CORE_WORKSPACE:-./workspace}
        target: /workspace
      - type: bind
        source: ${CUBED_CORE_TRACKER_MODELS_DIR:-./models/local}
        target: /models
        read_only: true
    ports:
      - "${CUBED_CORE_BIND_ADDRESS:-127.0.0.1}:${CUBED_CORE_PORT:-8000}:8000"

  lab-decode-gpu:
    <<: *lab
    profiles: [decode-gpu]
    build:
      context: .
      args:
        <<: *build-args
        CUBED_CORE_PYTHON_EXTRAS: label,decode,tracker-gpu,research-gpu
    image: ${CUBED_CORE_DECODE_GPU_IMAGE:-cubed-core:decode-gpu}
    environment:
      <<: *common-environment
      CUBED_CORE_DECODE_MODE: native
      CUBED_CORE_TRACKER_MODEL_MANIFEST: /models/manifest.json
      CUBED_CORE_TRACKER_ONNX_PROVIDERS: CUDAExecutionProvider
    volumes:
      - type: bind
        source: ${CUBED_CORE_WORKSPACE:-./workspace}
        target: /workspace
      - type: bind
        source: ${CUBED_CORE_TRACKER_MODELS_DIR:-./models/local}
        target: /models
        read_only: true
    gpus: all
    ports:
      - "${CUBED_CORE_BIND_ADDRESS:-127.0.0.1}:${CUBED_CORE_PORT:-8000}:8000"

  gpu-check:
    image: ${CUBED_CORE_GPU_SMOKE_IMAGE:-ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90}
    profiles: [gpu-check]
    gpus: all
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["nvidia-smi"]
